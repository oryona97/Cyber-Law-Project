services:
  # Backend Service (Node.js/Express)
  backend:
    build: ./backend
    ports:
      - "5001:5000"
    environment:
      - PORT=5000
      - DB_HOST=db
      - DB_USER=postgres
      - DB_PASS=password
      - DB_NAME=cyberlaw
      - DB_PORT=5432
      - OLLAMA_HOST=http://ollama:11434
    volumes:
      - ./backend:/app
      - /app/node_modules
    command: npm start
    depends_on:
      - db
      - ollama

  # Frontend Service (Vite/React)
  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host

  # n8n Service (Workflow Automation)
  n8n:
    image: docker.n8n.io/n8nio/n8n
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=${SUBDOMAIN}.loca.lt
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      - NODE_ENV=production
      - WEBHOOK_URL=https://${SUBDOMAIN}.loca.lt/
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE}
    volumes:
      - n8n_data:/home/node/.n8n

  # Database Service (PostgreSQL)
  db:
    image: postgres:15
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=cyberlaw
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # AI Service (Ollama)
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  n8n_data:
  postgres_data:
  ollama_data:
